<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>jayeshirl</title>
    
    <link rel="icon" type="image/png" href= favicon-removebg-preview.png>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --text: #ffffff;
            --pixel-font: 'VT323', monospace;
            --bg-image: url(yt.png); 
            --fg-image: url(yat.png);
            /* MC Assets */
            --block-grass: url(grass.png);
            --block-dirt: url(dirt.png);
            --block-log: url(log.png);
            --block-stone: url(stone.png);
            --block-diamond: url(diamond.png);
            --block-command: url(command.png);
            --block-steve: url(steve.png);
            /* Items */
            --item-totem: url(totem.png);
            --item-sword: url(sword.png);
            --item-cake: url(cake.png);
            --item-pickaxe: url(pickaxe.png);
        }

        /* Default Font: Pixel */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: var(--pixel-font); 
        }

        body { 
            background-color: #050505; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: var(--text);
        }

        /* --- PARALLAX LAYERS --- */
        .bg-container { 
            position: fixed; 
            top: -10%; 
            left: -10%; 
            width: 120%; 
            height: 120%; 
            z-index: 0; 
            pointer-events: none; 
        }

        .layer { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-repeat: no-repeat; 
            background-position: center; 
            background-size: cover; 
            will-change: transform;
        }

        .background-base { 
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--bg-image); 
            z-index: 1; 
        }

        .block-layer { z-index: 2; }
        .parallax-layer { background-image: var(--fg-image); z-index: 3; opacity: 0.5; }

        /* --- MC OBJECTS (Centered Scatter) --- */
        .mc-obj {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            animation: floatObj 6s ease-in-out infinite;
        }

        .block-type { width: 60px; height: 60px; }
        .item-type { width: 45px; height: 45px; }

        .b1 { top: 25%; left: 32%; background-image: var(--block-grass); animation-duration: 5s; }
        .b2 { top: 65%; left: 35%; background-image: var(--block-dirt); animation-duration: 7s; }
        .b3 { top: 22%; left: 62%; background-image: var(--block-command); filter: drop-shadow(0 0 15px #c170ff); animation-duration: 4s; }
        .b4 { top: 70%; left: 60%; background-image: var(--block-steve); animation-duration: 8s; }
        .b5 { top: 45%; left: 28%; background-image: var(--block-diamond); scale: 0.8; }
        .b6 { top: 50%; left: 68%; background-image: var(--block-stone); scale: 0.9; }
        
        .i1 { top: 35%; left: 38%; background-image: var(--item-totem); filter: drop-shadow(0 0 10px #ffea00); }
        .i2 { top: 55%; left: 40%; background-image: var(--item-sword); transform: rotate(-45deg); }
        .i3 { top: 38%; left: 58%; background-image: var(--item-cake); }
        .i4 { top: 58%; left: 56%; background-image: var(--item-pickaxe); }

        @keyframes floatObj {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* --- UI & CONTENT --- */
        .container { 
            position: relative; 
            z-index: 10; 
            text-align: center; 
            pointer-events: none; 
        }

        /* Modern Heading Font */
        h1 { 
            font-family: 'Inter', sans-serif; 
            font-size: 6rem; 
            font-weight: 900; 
            letter-spacing: -2px; 
        }
        
        h1 span {
            display: inline-block;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 50%, #9d50bb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shimmer 5s linear infinite;
        }

        .sub-heading { 
            font-size: 2rem; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 30px; 
        }

        .btn-group { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; width: 280px; margin: 0 auto; }
        
        /* Blurry Button Styling with Subtle Glow */
        .btn {
            text-decoration: none; color: white; padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            transition: 0.3s ease; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:hover { 
            background: rgba(255, 255, 255, 0.15); 
            transform: scale(1.05); 
            border-color: var(--primary); 
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .music-control {
            position: fixed; top: 30px; right: 30px; z-index: 100;
            cursor: pointer; width: 50px; height: 50px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: auto;
        }

        #canvas { position: absolute; top: 0; left: 0; z-index: 4; pointer-events: none; }

        @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    </style>
</head>
<body>

    <div class="music-control" id="music-btn"><i class="fa-solid fa-music"></i></div>
    <audio id="bg-music" loop><source src="track.mp3" type="audio/mpeg"></audio>

    <div class="bg-container">
        <div class="layer background-base" id="bg-base"></div>
        <div class="layer block-layer" id="block-layer">
            <div class="mc-obj block-type b1"></div>
            <div class="mc-obj block-type b2"></div>
            <div class="mc-obj block-type b3"></div>
            <div class="mc-obj block-type b4"></div>
            <div class="mc-obj block-type b5"></div>
            <div class="mc-obj block-type b6"></div>
            <div class="mc-obj item-type i1"></div>
            <div class="mc-obj item-type i2"></div>
            <div class="mc-obj item-type i3"></div>
            <div class="mc-obj item-type i4"></div>
        </div>
        <div class="layer parallax-layer" id="fg-layer"></div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="container">
        <h1 id="title"><span>JAYESH_IRL</span></h1>
        <div class="sub-heading">The Videogame of Life</div>
        
        <div class="btn-group">
            <a href="tel:+919959297618" class="btn"><i class="fa-solid fa-phone"></i> CALL ME</a>
            <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn"><i class="fa-brands fa-instagram"></i> @JAYESH_IRL</a>
            <div class="btn" title="Click to copy username" onclick="copyDiscord()">
                <i class="fa-brands fa-discord"></i> SHEESHER_
            </div>
        </div>
    </div>

    <script>
        const layers = {
            base: document.getElementById('bg-base'),
            blocks: document.getElementById('block-layer'),
            fg: document.getElementById('fg-layer'),
            title: document.getElementById('title')
        };

        // --- MOUSE PARALLAX ---
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

            layers.base.style.transform = `translate(${x * -20}px, ${y * -20}px)`;
            layers.blocks.style.transform = `translate(${x * -50}px, ${y * -50}px)`;
            layers.fg.style.transform = `translate(${x * -80}px, ${y * -80}px)`;
            layers.title.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
        });

        // --- DISCORD COPY ---
        function copyDiscord() {
            navigator.clipboard.writeText("sheesher_");
            alert("Discord username copied: sheesher_");
        }

        // --- MUSIC ---
        const musicBtn = document.getElementById('music-btn');
        const bgMusic = document.getElementById('bg-music');
        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                musicBtn.style.borderColor = "#00d2ff";
            } else {
                bgMusic.pause();
                musicBtn.style.borderColor = "rgba(255,255,255,0.2)";
            }
        });

        // --- SIMPLE PARTICLES ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init(); animate();
    </script>
</body>
</html>
