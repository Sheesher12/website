<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>jayesh_irl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --nebula: #9d50bb;
            --text: #ffffff;
            --bg-image: url(yt.png); 
            --fg-image: url(yat.png); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050505;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            opacity: 0;
            animation: fadeInPage 1.5s ease-out forwards;
        }

        /* --- BACKGROUND ENGINE --- */
        .bg-container {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            z-index: 0;
            pointer-events: none;
            background: #050505;
        }

        .background-base, .parallax-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            will-change: transform;
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.2, 1);
        }

        .background-base {
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--bg-image);
            z-index: 1;
        }

        .parallax-layer {
            background-image: var(--fg-image);
            z-index: 2;
            opacity: 0.7;
        }

        #canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* --- MUSIC TOGGLE --- */
        .music-control {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 100;
            cursor: pointer;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .music-control.playing {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            animation: pulse 2s infinite;
        }

        /* --- UI CONTAINER --- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(30px, 8vh, 50px);
            pointer-events: none;
        }

        .fade-element {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 1s ease-out forwards;
        }

        h1 {
            font-size: clamp(2.8rem, 12vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 10px;
        }

        h1 span {
            display: inline-block;
            /* Space Nebula Gradient */
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #00d2ff 25%, 
                #9d50bb 50%, 
                #6e48aa 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: 
                floatLetter 4s ease-in-out infinite, 
                shimmerSpace 8s linear infinite;
        }

        .sub-heading {
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--primary);
            text-transform: uppercase;
        }

        p {
            font-size: clamp(0.8rem, 3vw, 1rem);
            letter-spacing: 3px;
            opacity: 0.6;
            margin-top: 10px;
        }

        .static-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
            pointer-events: auto;
        }

        .btn {
            text-decoration: none;
            color: white;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        @media (hover: hover) {
            .btn:hover {
                background: rgba(255,255,255,0.12);
                transform: translateY(-2px);
                border-color: var(--primary);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatLetter { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes shimmerSpace { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        #enable-motion {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0, 210, 255, 0.2);
            border: 1px solid var(--primary);
            color: white;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            z-index: 1000;
            display: none;
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="music-control" id="music-btn">
        <i class="fa-solid fa-music" id="music-icon"></i>
    </div>

    <audio id="bg-music" loop>
        <source src="track.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-container">
        <div class="background-base" id="bg-base"></div>
        <div class="parallax-layer" id="fg-layer"></div>
    </div>
    
    <canvas id="canvas"></canvas>

    <div class="container">
        <div id="parallax-content" class="fade-element" style="animation-delay: 0.2s;">
            <h1 id="title-parallax"><span>JAYESH_IRL</span></h1>
            <div class="sub-heading fade-element" id="sub-parallax" style="animation-delay: 0.4s;">The Videogame of Life</div>
            <p class="fade-element" id="p-parallax" style="animation-delay: 0.6s;">After boards bro. After boards.</p>
        </div>

        <div class="static-controls fade-element" style="animation-delay: 0.8s;">
            <a href="tel:+919959297618" class="btn"><i class="fa-solid fa-phone"></i><span>Call Me</span></a>
            <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn"><i class="fa-brands fa-instagram"></i><span>@jayesh_irl</span></a>
        </div>
    </div>

    <button id="enable-motion">Unlock Motion Depth</button>

    <script>
        const bgBase = document.getElementById('bg-base');
        const fgLayer = document.getElementById('fg-layer');
        const title = document.getElementById('title-parallax');
        const sub = document.getElementById('sub-parallax');
        const pTag = document.getElementById('p-parallax');
        const musicBtn = document.getElementById('music-btn');
        const musicIcon = document.getElementById('music-icon');
        const bgMusic = document.getElementById('bg-music');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let mouseX = 0, mouseY = 0;
        let gyroX = 0, gyroY = 0;
        let particles = [], stars = [];
        let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if(isMobile) document.getElementById('enable-motion').style.display = 'block';

        // --- MUSIC ---
        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                musicBtn.classList.add('playing');
                musicIcon.classList.replace('fa-music', 'fa-pause');
            } else {
                bgMusic.pause();
                musicBtn.classList.remove('playing');
                musicIcon.classList.replace('fa-pause', 'fa-music');
            }
        });

        // --- PARALLAX ---
        function updateParallax() {
            const x = isMobile ? gyroX : (mouseX / (window.innerWidth / 2));
            const y = isMobile ? gyroY : (mouseY / (window.innerHeight / 2));

            bgBase.style.transform = `translate(${x * -2}%, ${y * -2}%)`;
            fgLayer.style.transform = `translate(${x * -4}%, ${y * -4}%)`;

            title.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
            sub.style.transform = `translate(${x * 5}px, ${y * 5}px)`;
            pTag.style.transform = `translate(${x * 2}px, ${y * 2}px)`;

            requestAnimationFrame(updateParallax);
        }

        document.addEventListener('mousemove', (e) => {
            if(!isMobile) {
                mouseX = e.clientX - window.innerWidth / 2;
                mouseY = e.clientY - window.innerHeight / 2;
            }
        });

        document.getElementById('enable-motion').addEventListener('click', function() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') {
                        window.addEventListener('deviceorientation', e => {
                            gyroX = e.gamma / 10; gyroY = (e.beta - 45) / 10;
                        });
                    }
                });
            } else {
                window.addEventListener('deviceorientation', e => {
                    gyroX = e.gamma / 10; gyroY = (e.beta - 45) / 10;
                });
            }
            this.style.display = 'none';
        });

        // --- VISUALS ---
        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = Array.from({length: 150}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                s: Math.random() * 1.8,
                vx: (Math.random() - 0.5) * 0.2,
                vy: (Math.random() - 0.5) * 0.2,
                a: Math.random()
            }));
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.a})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
            });

            stars.forEach((s, i) => {
                s.x += s.vx; s.y += s.vy;
                ctx.strokeStyle = `rgba(255, 255, 255, ${s.opacity})`;
                ctx.lineWidth = 2; ctx.beginPath();
                ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 6, s.y - s.vy * 6); ctx.stroke();
                s.opacity -= 0.015; if(s.opacity <= 0) stars.splice(i, 1);
            });

            if(Math.random() < 0.01) {
                stars.push({x: Math.random() * canvas.width, y: Math.random() * (canvas.height / 2), vx: 12 + Math.random() * 8, vy: 4 + Math.random() * 4, opacity: 1});
            }
            requestAnimationFrame(drawParticles);
        }

        document.addEventListener('mousedown', () => {
            if (navigator.vibrate) navigator.vibrate(25);
            for(let i=0; i<6; i++) stars.push({x: Math.random() * canvas.width, y: Math.random() * (canvas.height / 2), vx: 18, vy: 6, opacity: 1});
        });

        window.addEventListener('resize', initParticles);
        initParticles(); drawParticles(); updateParallax();
    </script>
</body>
</html>
