<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayeshirl</title>
    <link rel="icon" type="image/png" href= favicon-removebg-preview.png>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --text: #ffffff;
            --pixel-font: 'VT323', monospace;
            --bg-image: url(yt.png); 
            --fg-image: url(yat.png);
            --block-grass: url(grass.png);
            --block-dirt: url(dirt.png);
            --block-command: url(command.png);
            --block-steve: url(steve.png);
            --block-diamond: url(diamond.png);
            --block-stone: url(stone.png);
        }

        /* --- LIQUID GLASS SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--pixel-font); }
        body { background-color: #050505; color: var(--text); overflow-x: hidden; }

        section {
            min-height: 100vh; width: 100vw;
            position: relative;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }

        /* --- HERO --- */
        .hero-section { overflow: hidden; }
        .bg-container { position: fixed; top: -10%; left: -10%; width: 120%; height: 120%; z-index: 0; pointer-events: none; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-repeat: no-repeat; background-position: center; background-size: cover; will-change: transform; }
        .background-base { background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--bg-image); z-index: 1; }
        .block-layer { z-index: 5; }
        .parallax-layer { background-image: var(--fg-image); z-index: 3; opacity: 0.5; }

        .mc-obj { position: absolute; background-size: contain; background-repeat: no-repeat; image-rendering: pixelated; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); animation: floatObj 6s ease-in-out infinite; }
        .block-type { width: 65px; height: 65px; }
        .b1 { top: 20%; left: 20%; background-image: var(--block-grass); }
        .b2 { bottom: 20%; left: 25%; background-image: var(--block-dirt); }
        .b3 { top: 15%; right: 20%; background-image: var(--block-command); }
        .b4 { bottom: 15%; right: 25%; background-image: var(--block-steve); }
        .b5 { top: 45%; left: 15%; background-image: var(--block-diamond); }
        .b6 { top: 50%; right: 15%; background-image: var(--block-stone); }

        @keyframes floatObj { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-25px); } }

        .container { position: relative; z-index: 10; text-align: center; pointer-events: none; }
        h1 { font-family: 'Inter', sans-serif; font-size: 6.5rem; font-weight: 900; letter-spacing: -3px; }
        h1 span { display: inline-block; background: linear-gradient(135deg, #fff 0%, var(--primary) 50%, #9d50bb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shimmer 5s linear infinite; }
        .sub-heading { font-size: 2rem; color: var(--primary); text-transform: uppercase; margin-bottom: 30px; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; width: 220px; margin: 0 auto; }
        .btn {
            text-decoration: none; color: white; padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.3rem; cursor: pointer;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.1); border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }

        /* --- SCROLL INDICATOR --- */
        .mouse-scroll {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            opacity: 0.7; z-index: 10;
        }
        .mouse {
            width: 26px; height: 42px; border: 2px solid #fff; border-radius: 20px; position: relative;
        }
        .wheel {
            width: 4px; height: 8px; background: #fff; position: absolute; top: 8px; left: 50%;
            transform: translateX(-50%); border-radius: 2px; animation: scrollAnim 1.5s infinite;
        }
        @keyframes scrollAnim { 0% { opacity: 1; top: 8px; } 100% { opacity: 0; top: 20px; } }
        .scroll-text { font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }

        /* --- GALLERY SECTION (Reduced Transparency) --- */
        .gallery-section {
            background: rgba(10, 10, 10, 0.45); /* Lowered from 0.7 to 0.45 for more visibility */
            padding: 100px 20px; z-index: 20; backdrop-filter: blur(6px); /* Reduced blur slightly too */
            display: flex; flex-direction: column; align-items: center;
            perspective: 1000px;
        }

        .polaroid-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 50px; place-items: center; width: 100%; max-width: 1100px; margin-bottom: 120px;
            transform-style: preserve-3d;
        }

        .polaroid-wrapper { position: relative; text-align: center; }

        .polaroid {
            background: white; padding: 10px 10px 30px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: rotate(var(--r));
            transition: transform 0.2s ease-out; width: 200px; position: relative; overflow: hidden;
            pointer-events: auto;
        }
        
        .img-placeholder { 
            width: 100%; height: 160px; background: #222; 
            display: flex; align-items: center; justify-content: center; 
            color: #444; font-size: 2rem; overflow: hidden;
        }
        .img-placeholder img { width: 100%; height: 100%; object-fit: cover; }

        .year-label {
            display: block; margin-top: 15px; font-size: 1.8rem; color: var(--primary);
            opacity: 0; transform: translateY(10px); transition: 0.4s ease;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .polaroid-wrapper:hover .year-label { opacity: 1; transform: translateY(0); }

        /* --- GLASS TEXT --- */
        .info-text-container {
            width: 90%; max-width: 1100px; min-height: 180px; text-align: center; margin-bottom: 100px;
            padding: 40px; border-radius: 30px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .info-text { font-size: 1.5rem; line-height: 1.6; letter-spacing: 1.5px; color: rgba(255, 255, 255, 0.95); text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); display: inline; }
        .cursor { display: inline-block; width: 10px; height: 1.5rem; background: var(--primary); margin-left: 5px; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        footer { width: 100%; padding: 60px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer-socials { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; font-size: 1.8rem; }
        .footer-socials a { color: var(--primary); text-decoration: none; transition: 0.3s; opacity: 0.6; }
        .footer-socials a:hover { color: white; transform: translateY(-5px); opacity: 1; }
        .disclaimer { font-size: 0.9rem; color: rgba(255,255,255,0.3); letter-spacing: 1px; }

        .music-control { position: fixed; top: 30px; right: 30px; z-index: 100; cursor: pointer; width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        #canvas { position: fixed; top: 0; left: 0; z-index: 4; pointer-events: none; }
        @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    </style>
</head>
<body>

    <div class="music-control" id="music-btn"><i class="fa-solid fa-music"></i></div>
    <audio id="bg-music" loop><source src="track.mp3" type="audio/mpeg"></audio>
    <canvas id="canvas"></canvas>

    <section class="hero-section">
        <div class="bg-container">
            <div class="layer background-base" id="bg-base"></div>
            <div class="layer block-layer" id="block-layer">
                <div class="mc-obj block-type b1"></div><div class="mc-obj block-type b2"></div>
                <div class="mc-obj block-type b3"></div><div class="mc-obj block-type b4"></div>
                <div class="mc-obj block-type b5"></div><div class="mc-obj block-type b6"></div>
            </div>
            <div class="layer parallax-layer" id="fg-layer"></div>
        </div>
        <div class="container">
            <h1 id="title"><span>JAYESH_IRL</span></h1>
            <div class="sub-heading">The Videogame of Life</div>
            <div class="btn-group">
                <a href="tel:+919959297618" class="btn"><i class="fa-solid fa-phone"></i> CALL</a>
                <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn"><i class="fa-brands fa-instagram"></i> INSTA</a>
                <div class="btn" onclick="copyDiscord()"><i class="fa-brands fa-discord"></i> DISCORD</div>
            </div>
        </div>

        <div class="mouse-scroll">
            <div class="mouse"><div class="wheel"></div></div>
            <span class="scroll-text">Scroll</span>
        </div>
    </section>

    <section class="gallery-section">
        <div class="polaroid-grid" id="polaroid-grid">
            <div class="polaroid-wrapper">
                <div class="polaroid" style="--r: -3deg; --p-speed: 15;"><div class="img-placeholder"><img src="placeholder1.jpg" alt="2011"></div></div>
                <span class="year-label">2011</span>
            </div>
            <div class="polaroid-wrapper">
                <div class="polaroid" style="--r: 4deg; --p-speed: -20;"><div class="img-placeholder"><img src="placeholder2.jpg" alt="2025"></div></div>
                <span class="year-label">2025</span>
            </div>
            <div class="polaroid-wrapper">
                <div class="polaroid" style="--r: -2deg; --p-speed: 25;"><div class="img-placeholder"><img src="placeholder3.jpg" alt="2013"></div></div>
                <span class="year-label">2013</span>
            </div>
            <div class="polaroid-wrapper">
                <div class="polaroid" style="--r: 6deg; --p-speed: -10;"><div class="img-placeholder"><img src="placeholder4.jpg" alt="2026"></div></div>
                <span class="year-label">2026</span>
            </div>
        </div>

        <div class="info-text-container">
            <p class="info-text" id="scroll-text"></p><span class="cursor"></span>
        </div>

        <footer>
            <div class="footer-socials">
                <a href="https://instagram.com/jayesh_irl" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" onclick="copyDiscord()"><i class="fa-brands fa-discord"></i></a>
                <a href="tel:+919959297618"><i class="fa-solid fa-phone"></i></a>
            </div>
            <p class="disclaimer">Not affiliated with Mojang AB or Minecraft, just a fan</p>
        </footer>
    </section>

    <script>
        const layers = { base: document.getElementById('bg-base'), blocks: document.getElementById('block-layer'), fg: document.getElementById('fg-layer'), title: document.getElementById('title') };
        const polaroids = document.querySelectorAll('.polaroid');

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
            layers.base.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
            layers.blocks.style.transform = `translate(${x * -40}px, ${y * -40}px)`;
            layers.fg.style.transform = `translate(${x * -60}px, ${y * -60}px)`;
            layers.title.style.transform = `translate(${x * 15}px, ${y * 15}px)`;
            polaroids.forEach(p => {
                const style = p.getAttribute('style');
                const speed = style.match(/--p-speed: ([-]?\d+)/)[1];
                const rotateBase = style.match(/--r: ([-]?\d+)/)[1];
                p.style.transform = `translate(${x * speed}px, ${y * speed}px) rotate(${rotateBase}deg) rotateX(${y * -15}deg) rotateY(${x * 15}deg)`;
            });
        });

        function copyDiscord() { navigator.clipboard.writeText("sheesher_"); alert("Copied: sheesher_"); }

        const scrollMessage = "What's the point of this website you ask? Theres not much point for now, but after our exams I'm switching my main instagram account to a public one and I'm sure this'll help for engagement, whatever i post on instagram, edits, photos, moments, whatever it is? All gonna be on here";
        const scrollTextElement = document.getElementById('scroll-text');
        
        function updateScrollText() {
            const container = document.querySelector('.info-text-container');
            const rect = container.getBoundingClientRect();
            const windowHeight = window.innerHeight;
            let progress = (windowHeight - rect.top) / (windowHeight * 0.8); 
            progress = Math.max(0, Math.min(1, progress * 1.8)); 
            scrollTextElement.textContent = scrollMessage.substring(0, Math.floor(scrollMessage.length * progress));
        }

        window.addEventListener('scroll', updateScrollText);

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) { particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 4, speedY: (Math.random() - 0.5) * 4, opacity: Math.random() }); }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', init);
        init(); animate();

        const musicBtn = document.getElementById('music-btn');
        const bgMusic = document.getElementById('bg-music');
        musicBtn.addEventListener('click', () => { bgMusic.paused ? (bgMusic.play(), musicBtn.style.borderColor = "#00d2ff") : (bgMusic.pause(), musicBtn.style.borderColor = "rgba(255,255,255,0.2)"); });
    </script>
</body>
</html>
