<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>jayesh_irl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --text: #ffffff;
            --bg-image: url(yt.png); 
            --fg-image: url(yat.png); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0c29;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        /* --- BACKGROUND LAYERS (110% Zoom) --- */
        .background-base, .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; 
            /* On mobile, cover works better to prevent white edges */
            min-width: 110%;
            min-height: 110%;
            top: -5%;
            left: -5%;
            will-change: transform, filter;
            transition: transform 0.3s cubic-bezier(0.1, 0.5, 0.2, 1);
            pointer-events: none;
        }

        .background-base {
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--bg-image);
            z-index: 0;
        }

        .parallax-layer {
            background-image: var(--fg-image);
            z-index: 2;
            opacity: 0.6;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* --- UI CONTAINER --- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(20px, 8vh, 50px);
            pointer-events: none;
        }

        #parallax-content {
            will-change: transform;
        }

        h1 {
            font-size: clamp(2.8rem, 12vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 10px;
        }

        h1 span {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff 0%, #9d50bb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: floatLetter 4s ease-in-out infinite;
        }

        .sub-heading {
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--primary);
            text-transform: uppercase;
        }

        p {
            font-size: clamp(0.8rem, 3vw, 1rem);
            letter-spacing: 3px;
            opacity: 0.6;
            margin-top: 10px;
        }

        .static-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
            pointer-events: auto;
        }

        .btn {
            text-decoration: none;
            color: white;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(15px);
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        /* Desktop specific hover */
        @media (hover: hover) {
            .btn:hover {
                background: rgba(255,255,255,0.1);
                transform: translateY(-3px);
            }
        }

        /* Custom Cursor */
        #cursor-glow {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0,210,255,0.08) 0%, transparent 70%);
            position: fixed;
            top: 0; left: 0;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            display: none;
        }

        @media (min-width: 1024px) { #cursor-glow { display: block; } }

        @keyframes floatLetter { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        #enable-motion {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--primary);
            color: white;
            border-radius: 30px;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>

    <div id="cursor-glow"></div>
    <div class="background-base" id="bg-base"></div>
    <div class="parallax-layer" id="fg-layer"></div>
    <canvas id="canvas"></canvas>

    <div class="container">
        <div id="parallax-content">
            <h1 id="title-parallax">
                <span>JAYESH_IRL</span>
            </h1>
            <div class="sub-heading" id="sub-parallax">The Videogame of Life</div>
            <p id="p-parallax">After boards bro. After boards.</p>
        </div>

        <div class="static-controls">
            <a href="tel:+919959297618" class="btn js-glow-btn">
                <i class="fa-solid fa-phone"></i>
                <span>Call Me</span>
            </a>
            <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn js-glow-btn">
                <i class="fa-brands fa-instagram"></i>
                <span>@jayesh_irl</span>
            </a>
        </div>
    </div>

    <button id="enable-motion">Unlock Motion Depth</button>

    <script>
        const bgBase = document.getElementById('bg-base');
        const fgLayer = document.getElementById('fg-layer');
        const title = document.getElementById('title-parallax');
        const sub = document.getElementById('sub-parallax');
        const p = document.getElementById('p-parallax');
        const cursorGlow = document.getElementById('cursor-glow');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let mouseX = 0, mouseY = 0;
        let gyroX = 0, gyroY = 0;
        let particles = [], stars = [];
        let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if(isMobile) document.getElementById('enable-motion').style.display = 'block';

        function update() {
            const x = isMobile ? gyroX : (mouseX / (window.innerWidth / 2));
            const y = isMobile ? gyroY : (mouseY / (window.innerHeight / 2));

            // Background Parallax
            bgBase.style.transform = `translate(${x * -2}%, ${y * -2}%)`;
            fgLayer.style.transform = `translate(${x * -4}%, ${y * -4}%)`;

            // Micro Text Parallax (Staggered)
            title.style.transform = `translate(${x * 6}px, ${y * 6}px)`;
            sub.style.transform = `translate(${x * 3}px, ${y * 3}px)`;
            p.style.transform = `translate(${x * 1.5}px, ${y * 1.5}px)`;

            requestAnimationFrame(update);
        }

        // Desktop Inputs
        document.addEventListener('mousemove', (e) => {
            if(!isMobile) {
                mouseX = e.clientX - window.innerWidth / 2;
                mouseY = e.clientY - window.innerHeight / 2;
                cursorGlow.style.left = e.clientX + 'px';
                cursorGlow.style.top = e.clientY + 'px';
            }
        });

        // Mobile Motion
        document.getElementById('enable-motion').addEventListener('click', function() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', e => {
                        gyroX = e.gamma / 15; gyroY = (e.beta - 45) / 15;
                    });
                });
            } else {
                window.addEventListener('deviceorientation', e => {
                    gyroX = e.gamma / 15; gyroY = (e.beta - 45) / 15;
                });
            }
            this.style.display = 'none';
        });

        // Particles
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = Array.from({length: isMobile ? 30 : 80}, () => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                s: Math.random() * 1.5, vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2
            }));
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
            });
            stars.forEach((s, i) => {
                s.x += s.vx; s.y += s.vy;
                ctx.strokeStyle = `rgba(0, 210, 255, ${s.a})`;
                ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x - s.vx*8, s.y - s.vy*8); ctx.stroke();
                s.a -= 0.01; if(s.a <= 0) stars.splice(i, 1);
            });
            if(Math.random() < 0.01) stars.push({x: Math.random()*canvas.width, y:0, vx: 8+Math.random()*5, vy: 4+Math.random()*2, a: 1});
            requestAnimationFrame(draw);
        }

        document.addEventListener('mousedown', () => {
            if (navigator.vibrate) navigator.vibrate(15);
            for(let i=0; i<5; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height/2, vx: 10, vy: 5, a: 1});
        });

        window.addEventListener('resize', init);
        init(); draw(); update();
    </script>
</body>
</html>
