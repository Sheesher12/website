<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayesh_irl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --text: #ffffff;
            /* BACKGROUND IMAGE URL */
            --bg-image: url(yet.jpg); 
            /* FOREGROUND LAYER URL */
            --fg-image: url(yat.png); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f0c29;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        .background-base {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: 0;
            will-change: transform;
        }

        .parallax-layer {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: var(--fg-image);
            background-size: cover;
            background-position: center;
            z-index: 2;
            pointer-events: none;
            will-change: transform;
            opacity: 0.8;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        #parallax-content {
            display: inline-block;
            will-change: transform;
        }

        h1 {
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
        }

        h1 span {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 25%, #9d50bb 50%, #6e48aa 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: floatLetter 3s ease-in-out infinite, shiftGradient 10s ease infinite;
        }

        /* Letter Delays */
        h1 span:nth-child(1) { animation-delay: 0.0s; }
        h1 span:nth-child(2) { animation-delay: 0.1s; }
        h1 span:nth-child(3) { animation-delay: 0.2s; }
        h1 span:nth-child(4) { animation-delay: 0.3s; }
        h1 span:nth-child(5) { animation-delay: 0.4s; }
        h1 span:nth-child(6) { animation-delay: 0.5s; }
        h1 span:nth-child(7) { animation-delay: 0.6s; }
        h1 span:nth-child(8) { animation-delay: 0.7s; }
        h1 span:nth-child(9) { animation-delay: 0.8s; }
        h1 span:nth-child(10) { animation-delay: 0.9s; }

        .sub-heading {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--primary);
            animation: floatText 5s ease-in-out infinite;
        }

        p {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 40px;
            opacity: 0.7;
            animation: floatText 7s ease-in-out infinite;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: floatBtn 5.5s ease-in-out infinite;
        }

        .btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--primary);
            transform: translateY(-5px) scale(1.05) !important;
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4);
        }

        .insta-tag { color: var(--primary); font-weight: 700; }

        @keyframes floatLetter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        @keyframes floatText { 0%, 100%
