<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayesh_irl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --text: #ffffff;
            --bg-image: url(yt.png); 
            --fg-image: url(yat.png); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f0c29;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            cursor: default;
        }

        /* --- BACKGROUND LAYERS (Locked at 105%) --- */
        .background-base, .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 105% auto; 
            will-change: transform, filter;
            transition: transform 0.1s linear, filter 0.2s ease-out;
            pointer-events: none;
        }

        .background-base {
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), var(--bg-image);
            z-index: 0;
        }

        .parallax-layer {
            background-image: var(--fg-image);
            z-index: 2;
            opacity: 0.8;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px; 
        }

        #parallax-content {
            display: inline-block;
            will-change: transform;
            pointer-events: none; 
        }

        h1 {
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
        }

        h1 span {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 25%, #9d50bb 50%, #6e48aa 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: floatLetter 3s ease-in-out infinite, shiftGradient 10s ease infinite;
        }

        .sub-heading {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--primary);
            animation: floatText 5s ease-in-out infinite;
        }

        p {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.7;
            animation: floatText 7s ease-in-out infinite;
        }

        .static-controls {
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            pointer-events: auto; 
            cursor: pointer;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s, transform 0.2s, border-color 0.1s linear, box-shadow 0.1s linear;
        }

        .btn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .btn:active { transform: scale(0.95); }

        .insta-tag { color: var(--primary); font-weight: 700; }

        @keyframes floatLetter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        @keyframes floatText { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes shiftGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body>

    <div class="background-base" id="bg-base"></div>
    <div class="parallax-layer" id="fg-layer"></div>
    <canvas id="canvas"></canvas>

    <div class="container">
        <div id="parallax-content">
            <h1>
                <span style="--i:1">J</span><span style="--i:2">A</span><span style="--i:3">Y</span><span style="--i:4">E</span><span style="--i:5">S</span><span style="--i:6">H</span><span style="--i:7">_</span><span style="--i:8">I</span><span style="--i:9">R</span><span style="--i:10">L</span>
            </h1>
            <div class="sub-heading">The Videogame of Life</div>
            <p>After boards bro. After boards.</p>
        </div>

        <div class="static-controls">
            <a href="tel:+919959297618" class="btn js-glow-btn">
                <i class="fa-solid fa-phone"></i>
                <span>Phone</span>
            </a>
            <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn js-glow-btn">
                <i class="fa-brands fa-instagram"></i>
                <span class="insta-tag">@jayesh_irl</span>
            </a>
        </div>
    </div>

    <script>
        const bgBase = document.getElementById('bg-base');
        const fgLayer = document.getElementById('fg-layer');
        const content = document.getElementById('parallax-content');
        const glowButtons = document.querySelectorAll('.js-glow-btn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let mouseX = 0, mouseY = 0;
        let screenX = 0, screenY = 0;
        let isClicking = false;
        let currentBlur = 0;
        let particles = [], shootingStars = [];

        function updateParallax() {
            const normX = mouseX / (window.innerWidth / 2);
            const normY = mouseY / (window.innerHeight / 2);

            const moveLimit = 2.5; 
            const moveX_BG = Math.max(-moveLimit, Math.min(moveLimit, normX * -8));
            const moveY_BG = Math.max(-moveLimit, Math.min(moveLimit, normY * -8));
            const moveX_FG = Math.max(-moveLimit, Math.min(moveLimit, normX * -12));
            const moveY_FG = Math.max(-moveLimit, Math.min(moveLimit, normY * -12));

            const pulseScale = isClicking ? 1.02 : 1;
            const contentScale = isClicking ? 1.05 : 1;

            bgBase.style.transform = `translate(${moveX_BG}%, ${moveY_BG}%) scale(${pulseScale})`;
            fgLayer.style.transform = `translate(${moveX_FG}%, ${moveY_FG}%) scale(${pulseScale})`;
            content.style.transform = `translate(${mouseX / 10}px, ${mouseY / 10}px) scale(${contentScale})`;

            bgBase.style.filter = `blur(${currentBlur}px)`;
            fgLayer.style.filter = `blur(${currentBlur * 0.5}px)`;

            glowButtons.forEach(btn => {
                const rect = btn.getBoundingClientRect();
                const bX = rect.left + rect.width / 2;
                const bY = rect.top + rect.height / 2;
                const dist = Math.sqrt(Math.pow(screenX - bX, 2) + Math.pow(screenY - bY, 2));
                const intensity = Math.max(0, 1 - (dist / 400));
                btn.style.boxShadow = `0 0 ${intensity * 15}px rgba(0, 210, 255, ${intensity * 0.5})`;
                btn.style.borderColor = `rgba(0, 210, 255, ${0.1 + (intensity * 0.6)})`;
            });
            
            requestAnimationFrame(updateParallax);
        }

        function initParticles() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    baseX: Math.random() * canvas.width,
                    baseY: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    opacity: Math.random()
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                // Natural drift
                p.x += p.vx; p.y += p.vy;

                // Mouse Repulsion
                let dx = screenX - p.x;
                let dy = screenY - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = 150;
                let force = (maxDistance - distance) / maxDistance;

                if (distance < maxDistance) {
                    p.x -= forceDirectionX * force * 5;
                    p.y -= forceDirectionY * force * 5;
                }

                // Wrap around edges
                if(p.x < 0) p.x = canvas.width;
                if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height;
                if(p.y > canvas.height) p.y = 0;

                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });

            // Shooting stars logic
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let s = shootingStars[i]; s.x += s.vx; s.y += s.vy;
                const tx = s.x - (s.vx * 12), ty = s.y - (s.vy * 12);
                const grad = ctx.createLinearGradient(s.x, s.y, tx, ty);
                grad.addColorStop(0, '#00d2ff'); grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad; ctx.lineWidth = s.size; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
                if (s.y > canvas.height || s.x > canvas.width) shootingStars.splice(i, 1);
            }
            if (Math.random() < 0.02) {
                shootingStars.push({
                    x: Math.random() * canvas.width, y: 0, len: 150, 
                    vx: Math.random() * 4 + 8, vy: Math.random() * 2 + 4, size: 1
                });
            }
            requestAnimationFrame(animateParticles);
        }

        document.addEventListener('mousemove', (e) => {
            screenX = e.clientX; screenY = e.clientY;
            mouseX = (e.clientX - window.innerWidth / 2);
            mouseY = (e.clientY - window.innerHeight / 2);
            currentBlur = Math.min((Math.abs(e.movementX) + Math.abs(e.movementY)) / 25, 2.5);
            clearTimeout(window.blurTimeout);
            window.blurTimeout = setTimeout(() => { currentBlur = 0; }, 100);
        });

        document.addEventListener('mousedown', () => { isClicking = true; });
        document.addEventListener('mouseup', () => { isClicking = false; });
        window.addEventListener('resize', initParticles);

        updateParallax();
        initParticles();
        animateParticles();
    </script>
</body>
</html>
