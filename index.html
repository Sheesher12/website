<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayesh_irl</title>
    <style>
        :root {
            --primary: #00d2ff;
            --text: #ffffff;
            /* ADD YOUR IMAGE URL BELOW */
            --bg-image: url(yeeet.jpg); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f0c29; /* Fallback color */
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), var(--bg-image);
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Suble 2D Parallax Wrapper */
        #parallax-content {
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            will-change: transform;
        }

        h1 {
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 5px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: 0.3s;
            font-weight: 500;
        }

        .btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .insta-tag {
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container">
        <div id="parallax-content">
            <h1>JAYESH_IRL</h1>
            <p>After boards bro. After boards.</p>
            
            <div class="contact-info">
                <a href="tel:+919959297618" class="btn">
                     +91 9959297618
                </a>
                <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn">
                     <span class="insta-tag">@jayesh_irl</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // --- Suble 2D Parallax (X & Y movement only) ---
        const content = document.getElementById('parallax-content');
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 40;
            const moveY = (e.clientY - window.innerHeight / 2) / 40;
            content.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // --- Particle System ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    a: Math.random()
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${p.a})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
