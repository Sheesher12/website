<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayesh_irl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --text: #ffffff;
            --bg-image: url(yt.png); 
            --fg-image: url(yat.png); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f0c29;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            perspective: 1000px;
            cursor: default;
        }

        /* --- BACKGROUND LAYERS --- */
        .background-base, .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 105% auto;
            will-change: transform, filter;
            transition: transform 0.1s linear, filter 0.2s ease-out;
            pointer-events: none;
        }

        .background-base {
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), var(--bg-image);
            z-index: 0;
        }

        .parallax-layer {
            background-image: var(--fg-image);
            z-index: 2;
            opacity: 0.8;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* --- MAIN LAYOUT --- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px; /* Space between the moving text and static buttons */
        }

        /* This controls ONLY the text blocks */
        #parallax-content {
            display: inline-block;
            will-change: transform;
            pointer-events: none; 
            /* Ensure the pivot point is center so it tilts naturally */
            transform-origin: center center;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        h1 span {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 25%, #9d50bb 50%, #6e48aa 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: floatLetter 3s ease-in-out infinite, shiftGradient 10s ease infinite;
        }

        h1 span:nth-child(1) { animation-delay: 0.0s; }
        h1 span:nth-child(2) { animation-delay: 0.1s; }
        h1 span:nth-child(3) { animation-delay: 0.2s; }
        h1 span:nth-child(4) { animation-delay: 0.3s; }
        h1 span:nth-child(5) { animation-delay: 0.4s; }
        h1 span:nth-child(6) { animation-delay: 0.5s; }
        h1 span:nth-child(7) { animation-delay: 0.6s; }
        h1 span:nth-child(8) { animation-delay: 0.7s; }
        h1 span:nth-child(9) { animation-delay: 0.8s; }
        h1 span:nth-child(10) { animation-delay: 0.9s; }

        .sub-heading {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--primary);
            animation: floatText 5s ease-in-out infinite;
            pointer-events: none;
        }

        p {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.7;
            animation: floatText 7s ease-in-out infinite;
            pointer-events: none;
        }

        /* --- STATIC BUTTONS (Moved out of Parallax Content) --- */
        .static-controls {
            position: relative;
            z-index: 100; /* Ensure high z-index */
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            /* No Transforms or Animations here! */
        }

        .btn {
            pointer-events: auto; 
            cursor: pointer;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--primary);
            /* Simple hover scale is fine, but no parallax movement */
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .insta-tag { color: var(--primary); font-weight: 700; }

        @keyframes floatLetter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        @keyframes floatText { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes shiftGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body>

    <div class="background-base" id="bg-base"></div>
    <div class="parallax-layer" id="fg-layer"></div>
    <canvas id="canvas"></canvas>

    <div class="container">
        <div id="parallax-content">
            <h1>
                <span>J</span><span>A</span><span>Y</span><span>E</span><span>S</span><span>H</span><span>_</span><span>I</span><span>R</span><span>L</span>
            </h1>
            <div class="sub-heading">The Videogame of Life</div>
            <p>After boards bro. After boards.</p>
        </div>

        <div class="static-controls">
            <a href="tel:+919959297618" class="btn">
                <i class="fa-solid fa-phone"></i>
                <span>Phone</span>
            </a>
            <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn">
                <i class="fa-brands fa-instagram"></i>
                <span class="insta-tag">@jayesh_irl</span>
            </a>
        </div>
    </div>

    <script>
        const bgBase = document.getElementById('bg-base');
        const fgLayer = document.getElementById('fg-layer');
        const content = document.getElementById('parallax-content');

        let mouseX = 0;
        let mouseY = 0;
        let isClicking = false;
        let currentBlur = 0;

        function updateParallax() {
            // Pulse logic for Background and Text only
            const pulseScale = isClicking ? 1.02 : 1;
            const contentScale = isClicking ? 1.05 : 1;
            
            const x = mouseX;
            const y = mouseY;
            const rotateY = x / 80;
            const rotateX = -y / 80;

            // Move Backgrounds
            bgBase.style.transform = `translate(${x / 80}px, ${y / 80}px) scale(${pulseScale})`;
            fgLayer.style.transform = `translate(${x / 40}px, ${y / 40}px) scale(${pulseScale})`;
            
            // Move Text Content Only
            content.style.transform = `translate(${x / 20}px, ${y / 20}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${contentScale})`;

            // Apply Blur
            bgBase.style.filter = `blur(${currentBlur}px)`;
            fgLayer.style.filter = `blur(${currentBlur * 0.5}px)`;
            
            requestAnimationFrame(updateParallax);
        }

        let lastEventX = 0;
        let lastEventY = 0;
        let blurTimeout;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2);
            mouseY = (e.clientY - window.innerHeight / 2);

            const speedX = Math.abs(e.clientX - lastEventX);
            const speedY = Math.abs(e.clientY - lastEventY);
            const speed = Math.min((speedX + speedY) / 30, 2);
            
            currentBlur = speed;
            lastEventX = e.clientX;
            lastEventY = e.clientY;

            clearTimeout(blurTimeout);
            blurTimeout = setTimeout(() => {
                currentBlur = 0;
            }, 100);
        });

        document.addEventListener('mousedown', () => { isClicking = true; });
        document.addEventListener('mouseup', () => { isClicking = false; });

        updateParallax();

        // --- PARTICLE SYSTEM ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let shootingStars = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    a: Math.random()
                });
            }
        }

        function createShootingStar() {
            const startFromTop = Math.random() > 0.5;
            shootingStars.push({
                x: startFromTop ? Math.random() * canvas.width : 0,
                y: startFromTop ? 0 : Math.random() * (canvas.height / 2),
                len: Math.random() * 80 + 100,
                speed: Math.random() * 10 + 10,
                size: Math.random() * 1 + 0.5,
                vx: Math.random() * 4 + 8,
                vy: Math.random() * 2 + 4
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.a})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let s = shootingStars[i];
                s.x += s.vx; s.y += s.vy;
                const trailX = s.x - (s.vx * 12);
                const trailY = s.y - (s.vy * 12);
                
                const grad = ctx.createLinearGradient(s.x, s.y, trailX, trailY);
                grad.addColorStop(0, '#00d2ff');
                grad.addColorStop(1, 'transparent');
                
                ctx.strokeStyle = grad; ctx.lineWidth = s.size; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(trailX, trailY); ctx.stroke();
                
                if (s.y > canvas.height || s.x > canvas.width) shootingStars.splice(i, 1);
            }
            
            if (Math.random() < 0.02) createShootingStar();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init(); animate();
    </script>
</body>
</html>
