<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jayeshirl</title>
    <link rel="icon" type="image/png" href=favicon-removebg-preview.png>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --text: #ffffff;
            --pixel-font: 'VT323', monospace;
            --bg-image: url(yt.png); 
            --fg-image: url(yat.png);
            --block-grass: url(grass.png);
            --block-dirt: url(dirt.png);
            --block-command: url(command.png);
            --block-steve: url(steve.png);
            --block-diamond: url(diamond.png);
            --block-stone: url(stone.png);
            --item-totem: url(totem.png);
            --item-sword: url(sword.png);
            --item-cake: url(cake.png);
            --item-pickaxe: url(pickaxe.png);
        }

        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--pixel-font); }
        body { background-color: #050505; color: var(--text); overflow-x: hidden; }

        /* --- SIGNATURE LOGIC --- */
        #signature {
            width: 140px;
            height: auto;
            display: block;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 9999;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
            pointer-events: none;
            position: absolute;
        }

        .sig-initial {
            top: 15vh;
            left: 50%;
            transform: translateX(-50%) scale(1.3);
        }

        .sig-fixed {
            position: fixed;
            top: auto;
            bottom: 25px;
            left: 25px;
            transform: translateX(0) scale(0.8);
        }

        section { min-height: 100vh; width: 100vw; position: relative; display: flex; justify-content: center; align-items: center; flex-direction: column; }

        .hero-section { overflow: hidden; }
        .bg-container { position: fixed; top: -10%; left: -10%; width: 120%; height: 120%; z-index: 0; pointer-events: none; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-repeat: no-repeat; background-position: center; background-size: cover; will-change: transform; }
        .background-base { background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--bg-image); z-index: 1; }
        .block-layer { z-index: 5; width: 100%; height: 100%; position: absolute; }
        .parallax-layer { background-image: var(--fg-image); z-index: 3; opacity: 0.5; }

        /* --- MC OBJECTS --- */
        .mc-obj { position: absolute; background-size: contain; background-repeat: no-repeat; image-rendering: pixelated; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); animation: floatObj 6s ease-in-out infinite; }
        .block-type { width: 65px; height: 65px; }
        .item-type { width: 50px; height: 50px; }

        .b1 { top: 15%; left: 10%; background-image: var(--block-grass); }
        .b2 { bottom: 15%; left: 15%; background-image: var(--block-dirt); animation-delay: 1s; }
        .b3 { top: 10%; right: 10%; background-image: var(--block-command); animation-delay: 2s; }
        .b4 { bottom: 10%; right: 15%; background-image: var(--block-steve); animation-delay: 3s; }
        .b5 { top: 40%; left: 5%; background-image: var(--block-diamond); animation-delay: 1.5s; }
        .b6 { top: 45%; right: 5%; background-image: var(--block-stone); animation-delay: 2.5s; }
        .i1 { top: 25%; left: 25%; background-image: var(--item-totem); }
        .i2 { bottom: 25%; left: 30%; background-image: var(--item-sword); transform: rotate(-45deg); }
        .i3 { top: 20%; right: 25%; background-image: var(--item-cake); }
        .i4 { bottom: 20%; right: 30%; background-image: var(--item-pickaxe); }

        @keyframes floatObj { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-30px); } }

        .container { position: relative; z-index: 10; text-align: center; pointer-events: none; padding-top: 100px; }
        h1 { font-family: 'Inter', sans-serif; font-size: 9.5rem; font-weight: 900; letter-spacing: -5px; line-height: 0.8; }
        h1 span { display: inline-block; background: linear-gradient(135deg, #fff 0%, var(--primary) 50%, #9d50bb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shimmer 5s linear infinite; }
        .sub-heading { font-size: 2.3rem; color: var(--primary); text-transform: uppercase; margin-top: 25px; margin-bottom: 30px; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; width: 220px; margin: 0 auto; }
        .btn { text-decoration: none; color: white; padding: 10px 20px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.3rem; cursor: pointer; }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.1); border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }

        /* --- GALLERY & INFO --- */
        .gallery-section { background: rgba(10, 10, 10, 0.6); padding: 100px 20px; z-index: 20; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; perspective: 1000px; }
        .polaroid-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 50px; place-items: center; width: 100%; max-width: 1100px; margin-bottom: 120px; }
        .polaroid { background: white; padding: 10px 10px 30px 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: rotate(var(--r)); width: 200px; }
        .img-placeholder { width: 100%; height: 160px; background: #222; overflow: hidden; }
        .img-placeholder img { width: 100%; height: 100%; object-fit: cover; }

        /* Adjusted Smaller Text Size Here */
        .info-text-container { width: 80%; max-width: 900px; min-height: 140px; text-align: center; margin-bottom: 100px; padding: 30px; border-radius: 30px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); }
        .info-text { font-size: 1.2rem; line-height: 1.5; color: white; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); letter-spacing: 1px; }

        footer { width: 100%; padding: 60px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .music-control { position: fixed; top: 30px; right: 30px; z-index: 10000; cursor: pointer; width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); }
        
        #canvas { position: fixed; top: 0; left: 0; z-index: 4; pointer-events: none; }
        @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    </style>
</head>
<body>

    <img src="signature.png" id="signature" class="sig-initial" alt="Signature">

    <div class="music-control" id="music-btn"><i class="fa-solid fa-music" id="music-icon"></i></div>
    <audio id="bg-music" loop><source src="track.mp3" type="audio/mpeg"></audio>
    <canvas id="canvas"></canvas>

    <div id="main-content">
        <section class="hero-section">
            <div class="bg-container">
                <div class="layer background-base" id="bg-base"></div>
                <div class="layer block-layer" id="block-layer">
                    <div class="mc-obj block-type b1"></div><div class="mc-obj block-type b2"></div>
                    <div class="mc-obj block-type b3"></div><div class="mc-obj block-type b4"></div>
                    <div class="mc-obj block-type b5"></div><div class="mc-obj block-type b6"></div>
                    <div class="mc-obj item-type i1"></div><div class="mc-obj item-type i2"></div>
                    <div class="mc-obj item-type i3"></div><div class="mc-obj item-type i4"></div>
                </div>
                <div class="layer parallax-layer" id="fg-layer"></div>
            </div>
            
            <div class="container">
                <h1 id="title"><span>JAYESH_IRL</span></h1>
                <div class="sub-heading">The Videogame of Life</div>
                <div class="btn-group">
                    <a href="tel:+919959297618" class="btn"><i class="fa-solid fa-phone"></i> CALL</a>
                    <a href="https://instagram.com/jayesh_irl" target="_blank" class="btn"><i class="fa-brands fa-instagram"></i> INSTA</a>
                    <div class="btn" onclick="copyDiscord()"><i class="fa-brands fa-discord"></i> DISCORD</div>
                </div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="polaroid-grid">
                <div class="polaroid" style="--r: -3deg;"><div class="img-placeholder"><img src="placeholder1.jpg"></div></div>
                <div class="polaroid" style="--r: 4deg;"><div class="img-placeholder"><img src="placeholder2.jpg"></div></div>
                <div class="polaroid" style="--r: -2deg;"><div class="img-placeholder"><img src="placeholder3.jpg"></div></div>
                <div class="polaroid" style="--r: 6deg;"><div class="img-placeholder"><img src="placeholder4.jpg"></div></div>
            </div>

            <div class="info-text-container">
                <p class="info-text" id="scroll-text"></p>
            </div>

            <footer>
                <p>Not affiliated with Mojang AB or Minecraft</p>
            </footer>
        </section>
    </div>

    <script>
        const signature = document.getElementById('signature');
        const layers = { base: document.getElementById('bg-base'), blocks: document.getElementById('block-layer'), fg: document.getElementById('fg-layer'), title: document.getElementById('title') };

        window.addEventListener('scroll', () => {
            if (window.scrollY > 100) {
                signature.className = 'sig-fixed';
            } else {
                signature.className = 'sig-initial';
            }
        });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
            layers.base.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
            layers.blocks.style.transform = `translate(${x * -40}px, ${y * -40}px)`;
            layers.fg.style.transform = `translate(${x * -60}px, ${y * -60}px)`;
            layers.title.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
        });

        function copyDiscord() { navigator.clipboard.writeText("sheesher_"); alert("Copied Discord ID!"); }

        const scrollMessage = "What's the point of this website you ask? Theres not much point for now, but after our exams I'm switching my main instagram account to a public one and I'm sure this'll help for engagement, whatever i post on instagram, edits, photos, moments, whatever it is? All gonna be on here. TLDR : Coming soon";
        const scrollTextElement = document.getElementById('scroll-text');
        
        window.addEventListener('scroll', () => {
            const container = document.querySelector('.info-text-container');
            const rect = container.getBoundingClientRect();
            let progress = (window.innerHeight - rect.top) / (window.innerHeight * 0.8); 
            progress = Math.max(0, Math.min(1, progress * 1.8)); 
            scrollTextElement.textContent = scrollMessage.substring(0, Math.floor(scrollMessage.length * progress));
        });

        const musicBtn = document.getElementById('music-btn');
        const bgMusic = document.getElementById('bg-music');
        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                document.getElementById('music-icon').classList.replace('fa-music', 'fa-pause');
            } else {
                bgMusic.pause();
                document.getElementById('music-icon').classList.replace('fa-pause', 'fa-music');
            }
        });

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) { particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 4, speedY: (Math.random() - 0.5) * 4, opacity: Math.random() }); }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', init);
        init(); animate();
    </script>
</body>
</html>
